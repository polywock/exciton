schema_version = "1.0.0"
id = "exciton"
version = "1.0.19"
name = "Exciton Voice Control"
tagline = "Control Blender with your voice"
author = "Exciton.dev"
maintainer = "exciton.dev"
website = "https://exciton.dev"
type = "add-on"
license = [ "SPDX:GPL-3.0-or-later" ]
tags = [ "User Interface", "3D View" ]
blender_version_min = "5.0.0"
platforms = [
  "windows-x64",
  "windows-arm64",
  "macos-arm64",
  "macos-x64",
  "linux-x64",
  "linux-arm64"
]
wheels = [
  "./wheels/websocket_client-1.9.0-py3-none-any.whl"
]

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "node_modules/",
  ".venv/",
  "package.json",
  "package-lock.json",
  "tsconfig.json",
  "uv.lock",
  "build/",
  "tools/",
  "tests/",
  "dist/",
  ".ruff_cache/",
  ".github/",
  ".vscode/",
  ".git/",
  ".gitignore",
  "*.zip",
  "*.md",
  "*.zsh",
  ".DS_Store",
  "pyproject.toml",
  ".python-version"
]

[permissions]
files = "Save settings and logs"
microphone = "Record audio for voice control"
network = "Recognize speech, sync settings, send diagnostics on request"
